[metadata]
name = horizon-sextant
summary = Sextant — read-only AI ops assistant panel for OpenStack Horizon
description_file = README.rst
author = Your Team
license = Apache-2.0
classifiers =
    Environment :: OpenStack
    Framework :: Django
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3

[options]
python_requires = >=3.9
packages =
    sextant
include_package_data = True
install_requires =
    anthropic>=1.0.0

[options.package_data]
sextant =
    templates/sextant/*.html
    enabled/*.py
